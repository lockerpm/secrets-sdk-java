image: "maven:3.9.16-eclipse-temurin-11@sha256:1fee93ca227db7e8b8c7c72752ada0f03da6ebab40addd6fe48ac6293424186c"

stages:
  - quality
  - release-verify
  - central-stage
  - publish

variables:
  MAVEN_OPTS: >-
    -Dmaven.repo.local=.m2/repository
    -Dfile.encoding=UTF-8
  MAVEN_CLI_OPTS: >-
    --batch-mode
    --no-transfer-progress
    --strict-checksums
    --errors

cache:
  key:
    files:
      - pom.xml
    prefix: maven-temurin11
  paths:
    - .m2/repository/
  policy: pull-push

quality:
  stage: quality
  script:
    - mvn ${MAVEN_CLI_OPTS} clean verify
    - export SDK_VERSION="$(tr -d '\r\n' < VERSION)"
    - jar tf "target/lockersm-${SDK_VERSION}.jar" | grep -Fx META-INF/LICENSE
    - jar tf "target/lockersm-${SDK_VERSION}.jar" | grep -Fx locker-cli-ed25519-public-key.txt
    - jar tf "target/lockersm-${SDK_VERSION}-sources.jar" | grep -Fx META-INF/LICENSE
    - jar tf "target/lockersm-${SDK_VERSION}-sources.jar" | grep -Fx locker-cli-ed25519-public-key.txt
    - jar tf "target/lockersm-${SDK_VERSION}-javadoc.jar" | grep -Fx resources/LICENSE
    - git diff --check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

release-readiness:
  stage: release-verify
  cache: []
  variables:
    MAVEN_OPTS: >-
      -Dmaven.repo.local=.m2/release-${CI_JOB_ID}
      -Dfile.encoding=UTF-8
  needs:
    - job: quality
      artifacts: false
  script:
    - >-
      test -n "${LOCKER_CLI_PUBLIC_KEY_FILE:-}" ||
      { echo "missing protected CI variable: LOCKER_CLI_PUBLIC_KEY_FILE" >&2; exit 1; }
    - >-
      test -s "$LOCKER_CLI_PUBLIC_KEY_FILE" ||
      { echo "LOCKER_CLI_PUBLIC_KEY_FILE must reference a nonempty file" >&2; exit 1; }
    - >-
      test -n "${MAVEN_GPG_KEY_FILE:-}" ||
      { echo "missing protected CI variable: MAVEN_GPG_KEY_FILE" >&2; exit 1; }
    - >-
      test -s "$MAVEN_GPG_KEY_FILE" ||
      { echo "MAVEN_GPG_KEY_FILE must reference a nonempty file" >&2; exit 1; }
    - >-
      test -n "${MAVEN_GPG_PASSPHRASE:-}" ||
      { echo "missing protected CI variable: MAVEN_GPG_PASSPHRASE" >&2; exit 1; }
    - test -s LICENSE
    - >-
      mvn ${MAVEN_CLI_OPTS}
      -Prelease
      -Dlocker.release.validation=true
      -Dgpg.keyFilePath="$MAVEN_GPG_KEY_FILE"
      -Dproject.build.outputTimestamp="$CI_COMMIT_TIMESTAMP"
      clean verify
    - export SDK_VERSION="$(tr -d '\r\n' < VERSION)"
    - mkdir -p release-dist
    - >-
      mvn ${MAVEN_CLI_OPTS}
      -Dexec.classpathScope=test
      -Dexec.mainClass=locker.distribution.CentralBundleBuilder
      -Dexec.args="$CI_PROJECT_DIR $SDK_VERSION
      $CI_PROJECT_DIR/release-dist/central-bundle.zip
      $CI_COMMIT_TIMESTAMP $LOCKER_CLI_PUBLIC_KEY_FILE"
      exec:java
    - cp "$LOCKER_CLI_PUBLIC_KEY_FILE" release-dist/locker-cli-ed25519-public-key.txt
    - >-
      (cd release-dist &&
      sha256sum central-bundle.zip locker-cli-ed25519-public-key.txt > SHA256SUMS)
    - printf '%s\n' "$CI_COMMIT_SHA" > release-dist/source-commit
    - printf '%s\n' "$CI_COMMIT_TAG" > release-dist/release-tag
    - printf '%s\n' "$SDK_VERSION" > release-dist/sdk-version
    - printf '%s\n' "release" > release-dist/maven-profile
  artifacts:
    name: lockersm-java-release-${CI_COMMIT_SHA}
    paths:
      - release-dist/
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$/'
    - when: never

stage-maven-central:
  stage: central-stage
  cache: []
  variables:
    MAVEN_OPTS: >-
      -Dmaven.repo.local=.m2/release-${CI_JOB_ID}
      -Dfile.encoding=UTF-8
  interruptible: false
  resource_group: maven-central
  needs:
    - job: release-readiness
      artifacts: true
  environment:
    name: maven-central-staging
    deployment_tier: staging
  script:
    - test -s LICENSE
    - test "$(cat release-dist/source-commit)" = "$CI_COMMIT_SHA"
    - test "$(cat release-dist/release-tag)" = "$CI_COMMIT_TAG"
    - test "$(cat release-dist/sdk-version)" = "$(tr -d '\r\n' < VERSION)"
    - test "$(cat release-dist/maven-profile)" = "release"
    - (cd release-dist && sha256sum --check SHA256SUMS)
    - export LOCKER_CLI_PUBLIC_KEY_FILE="$CI_PROJECT_DIR/release-dist/locker-cli-ed25519-public-key.txt"
    - >-
      mvn ${MAVEN_CLI_OPTS}
      -Dlocker.release.validation=true
      '-Dtest=locker.distribution.ReleaseReadinessTest#validatesProtectedCiReleaseInputs'
      test
    - >-
      test -n "${MAVEN_CENTRAL_USERNAME:-}" ||
      { echo "missing protected CI variable: MAVEN_CENTRAL_USERNAME" >&2; exit 1; }
    - >-
      test -n "${MAVEN_CENTRAL_PASSWORD:-}" ||
      { echo "missing protected CI variable: MAVEN_CENTRAL_PASSWORD" >&2; exit 1; }
    - |
      stage_status=0
      mvn ${MAVEN_CLI_OPTS} \
        -Dexec.classpathScope=test \
        -Dexec.mainClass=locker.distribution.CentralPublisher \
        -Dexec.args="stage release-dist/central-bundle.zip release-dist/central-deployment-id" \
        exec:java ||
        stage_status=$?
      if [ -s release-dist/central-deployment-id ]; then
        (cd release-dist &&
          sha256sum central-deployment-id >> SHA256SUMS)
      fi
      exit "$stage_status"
  artifacts:
    when: always
    name: lockersm-java-central-stage-${CI_COMMIT_SHA}
    paths:
      - release-dist/
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$/'
      when: manual
      allow_failure: false
    - when: never

publish-maven-central:
  stage: publish
  cache: []
  variables:
    MAVEN_OPTS: >-
      -Dmaven.repo.local=.m2/release-${CI_JOB_ID}
      -Dfile.encoding=UTF-8
  interruptible: false
  resource_group: maven-central
  needs:
    - job: stage-maven-central
      artifacts: true
  environment:
    name: maven-central
    deployment_tier: production
  script:
    - test -s LICENSE
    - test "$(cat release-dist/source-commit)" = "$CI_COMMIT_SHA"
    - test "$(cat release-dist/release-tag)" = "$CI_COMMIT_TAG"
    - test "$(cat release-dist/sdk-version)" = "$(tr -d '\r\n' < VERSION)"
    - test "$(cat release-dist/maven-profile)" = "release"
    - (cd release-dist && sha256sum --check SHA256SUMS)
    - export LOCKER_CLI_PUBLIC_KEY_FILE="$CI_PROJECT_DIR/release-dist/locker-cli-ed25519-public-key.txt"
    - >-
      mvn ${MAVEN_CLI_OPTS}
      -Dlocker.release.validation=true
      '-Dtest=locker.distribution.ReleaseReadinessTest#validatesProtectedCiReleaseInputs'
      test
    - >-
      test -n "${MAVEN_CENTRAL_USERNAME:-}" ||
      { echo "missing protected CI variable: MAVEN_CENTRAL_USERNAME" >&2; exit 1; }
    - >-
      test -n "${MAVEN_CENTRAL_PASSWORD:-}" ||
      { echo "missing protected CI variable: MAVEN_CENTRAL_PASSWORD" >&2; exit 1; }
    - >-
      mvn ${MAVEN_CLI_OPTS}
      -Dexec.classpathScope=test
      -Dexec.mainClass=locker.distribution.CentralPublisher
      -Dexec.args="publish release-dist/central-deployment-id"
      exec:java
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$/'
      when: manual
      allow_failure: false
    - when: never
